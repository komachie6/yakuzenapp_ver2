<title>体質診断｜こしらえごと</title>

<style>
:root{
  --bg:#FBF7F0; --surface:#FFFDF8; --ink:#3A2A1E; --ink-soft:#8A7866; --ink-mute:#A99B8B;
  --green:#356145; --green-deep:#1F3A2B; --honey:#B8935A; --honey-soft:#F0E4CE;
  --crimson:#8A3B2F; --line:#ECE4D5;
  --shadow:0 6px 22px rgba(58,42,30,.10); --shadow-sm:0 3px 12px rgba(58,42,30,.08);
  --serif:'Noto Serif JP',serif; --maru:'Zen Maru Gothic',sans-serif; --kaku:'Zen Kaku Gothic New',sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--kaku);line-height:1.8;font-size:16px;
  -webkit-font-smoothing:antialiased;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:560px;margin:0 auto;padding:18px 18px 56px}
.screen{display:none;animation:fade .45s ease both}
.screen.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
button:focus-visible,a:focus-visible{outline:3px solid var(--honey);outline-offset:3px}

/* ============ START（洗練・元デザインに復帰） ============ */
#start{font-family:var(--kaku);text-align:center;position:relative;overflow:hidden}
#start.active{display:block}
#start::before{content:'';position:absolute;top:-60px;left:-60px;width:220px;height:220px;
  background:radial-gradient(closest-side,rgba(184,147,90,.26),rgba(184,147,90,.07) 60%,transparent 80%);
  border-radius:50%;pointer-events:none;z-index:0}
#start::after{content:'';position:absolute;bottom:-70px;right:-70px;width:250px;height:250px;
  background:radial-gradient(closest-side,rgba(31,58,43,.20),rgba(31,58,43,.05) 60%,transparent 80%);
  border-radius:50%;pointer-events:none;z-index:0}
.ko-inner{position:relative;z-index:1;max-width:460px;margin:0 auto;padding:30px 6px 0}
.ko-eyebrow{font-family:var(--maru);font-weight:500;font-size:12px;letter-spacing:.3em;
  color:var(--honey);margin:0}
.rule{display:flex;align-items:center;justify-content:center;gap:9px;margin:14px auto}
.rule span{height:1px;width:64px;background:var(--honey);opacity:.7}
.rule i{width:6px;height:6px;background:var(--honey);transform:rotate(45deg);flex:0 0 auto}
.ko-dot{width:5px;height:5px;border-radius:50%;background:var(--honey);margin:0 auto 20px}
.ko-h1{font-family:var(--serif);font-weight:700;font-size:30px;line-height:1.7;letter-spacing:.07em;margin:0}
.ko-band{margin:20px auto 4px;max-width:300px}
.ko-band img{display:block;width:100%;height:120px;object-fit:cover;border-radius:8px;box-shadow:var(--shadow-sm)}
@media (max-width:380px){.ko-band{max-width:260px}.ko-band img{height:108px}}
.ko-lead{font-family:var(--kaku);font-size:15px;color:var(--ink-soft);letter-spacing:.05em;margin:20px 0 0}
.ko-sub{font-family:var(--maru);font-size:16px;color:var(--ink);font-weight:500;letter-spacing:.04em;
  line-height:1.9;margin:18px 0 26px}
.ko-start{font-family:var(--maru);font-weight:500;font-size:17px;letter-spacing:.12em;
  background:var(--green-deep);color:#FBF7F0;border:none;border-radius:14px;padding:17px 20px;width:100%;
  cursor:pointer;box-shadow:0 6px 16px rgba(31,58,43,.24);transition:transform .12s ease}
.ko-start:active{transform:scale(.98)}
.ko-time{font-family:var(--kaku);font-size:13px;color:var(--ink-soft);letter-spacing:.05em;margin:16px 0 0}
.ko-disc{font-family:var(--kaku);font-size:11.5px;color:var(--ink-mute);line-height:1.8;margin:20px 0 0}

/* ============ QUESTION（カジュアル・維持） ============ */
.prog-head{display:flex;justify-content:space-between;align-items:center;font-family:var(--maru);
  font-size:13px;color:var(--ink-soft);margin:6px 0 10px;font-weight:500}
.prog-head b{color:var(--green);font-size:15px}
.prog{height:9px;background:var(--honey-soft);border-radius:999px;overflow:hidden;margin-bottom:26px}
.prog>i{display:block;height:100%;width:0;background:var(--green);border-radius:999px;transition:width .4s ease}
.q{font-family:var(--maru);font-weight:700;font-size:20px;line-height:1.6;letter-spacing:.03em;margin:0 0 20px;text-align:center}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;cursor:pointer;background:var(--surface);
  border:2px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;font-family:var(--kaku);
  font-size:15.5px;font-weight:500;line-height:1.6;color:var(--ink);
  transition:transform .12s ease,border-color .2s ease,background .2s ease,box-shadow .2s ease}
.opt:active{transform:scale(.985)}
.opt.sel{border-color:var(--green);background:#F1F6F2;box-shadow:var(--shadow-sm)}
.opt .dot{flex:0 0 auto;width:22px;height:22px;border-radius:50%;border:2px solid var(--honey);background:transparent;transition:.2s}
.opt.sel .dot{background:var(--green);border-color:var(--green);box-shadow:inset 0 0 0 3px #F1F6F2}
@media (hover:hover){.opt:hover{border-color:var(--honey)}}
.btn-ghost{background:transparent;color:var(--ink-soft);font-family:var(--kaku);font-weight:500;font-size:14px;
  border-radius:999px;padding:10px;cursor:pointer;border:none;width:100%}
.btn-ghost:active{color:var(--ink)}

/* ============ RESULT（カジュアル・維持） ============ */
.eyebrow{font-family:var(--maru);font-weight:500;font-size:12px;letter-spacing:.18em;color:var(--honey);text-align:center;margin:6px 0 14px}
.result-card{background:var(--surface);border-radius:24px;padding:26px 22px;box-shadow:var(--shadow);
  text-align:center;margin-bottom:28px;border:1px solid var(--line)}
.result-card .lead{font-family:var(--maru);font-size:14px;color:var(--ink-soft);font-weight:500;margin:0 0 8px;letter-spacing:.05em}
.type-name{font-family:var(--maru);font-weight:700;font-size:34px;color:var(--green-deep);letter-spacing:.04em;margin:0 0 4px}
.type-yomi{font-size:13px;color:var(--honey);letter-spacing:.12em;margin:0 0 16px;font-family:var(--maru)}
.type-desc{font-size:15px;line-height:1.95;color:var(--ink);margin:0;text-align:left}
.cat-block{margin-bottom:26px}
.cat-label{display:flex;align-items:center;gap:10px;margin:0 0 14px}
.cat-label .num{font-family:var(--maru);font-weight:700;font-size:13px;color:#FFFDF8;background:var(--honey);
  border-radius:999px;min-width:26px;height:26px;display:flex;align-items:center;justify-content:center;padding:0 8px}
.cat-label h3{font-family:var(--maru);font-weight:700;font-size:19px;margin:0;letter-spacing:.04em}
.cat-label .cnt{font-size:13px;color:var(--ink-soft);font-weight:500;margin-left:auto;font-family:var(--maru)}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px;
  box-shadow:var(--shadow-sm);display:flex;align-items:center;gap:12px}
.rcard .rtext{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:7px}
.rcard .rname{font-family:var(--maru);font-weight:700;font-size:16px;line-height:1.45;color:var(--ink)}
.rcard .rphoto{flex:0 0 auto;width:56px;height:56px;border-radius:10px;object-fit:cover;display:block;background:#EEF4EF}
.rbadge{align-self:flex-start;font-family:var(--maru);font-weight:700;font-size:11px;line-height:1;
  padding:4px 10px;border-radius:6px;letter-spacing:.06em}
.cat-kanso{background:#E2EDEF;color:#3C6B73}
.cat-kounenki{background:#F4E4E1;color:#9C5A50}
.cat-mansei{background:#E6EFE4;color:#4C7B58}
.cat-gansei{background:#ECE6F1;color:#6B5E88}
.cat-nemuri{background:#E5E8F1;color:#4E5680}
.hidden-r{display:none}
.more{margin:2px 0 4px;background:transparent;border:2px dashed var(--honey);color:var(--green);border-radius:14px;
  padding:12px;width:100%;cursor:pointer;font-family:var(--maru);font-weight:700;font-size:14px;letter-spacing:.04em;transition:background .2s;
  display:flex;align-items:center;justify-content:center;gap:8px}
.more .chev{color:var(--honey);font-size:17px}
.more:active{background:var(--honey-soft)}
.see-all{width:100%;margin:10px 0 0;background:var(--green);color:#FFFDF8;border:none;border-radius:14px;
  padding:15px;cursor:pointer;font-family:var(--maru);font-weight:700;font-size:15px;letter-spacing:.05em;
  display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 5px 14px rgba(53,97,69,.22);transition:transform .12s ease}
.see-all .chev{font-size:17px}
.see-all:active{transform:scale(.99)}
.full-panel{margin-top:16px}
.reco-title{font-family:var(--maru);font-weight:700;font-size:17px;color:var(--ink);text-align:center;
  letter-spacing:.05em;margin:4px 0 16px}
.acc-toggle{width:100%;margin:6px 0 0;background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:15px 18px;cursor:pointer;font-family:var(--maru);font-weight:700;font-size:15px;color:var(--green-deep);
  display:flex;align-items:center;justify-content:space-between;box-shadow:var(--shadow-sm);letter-spacing:.03em}
.acc-toggle .chev{color:var(--honey);font-size:18px;margin-left:10px;flex:0 0 auto}
.acc-toggle:active{transform:scale(.99)}
.acc-panel{display:none;margin-top:16px}
.acc-panel.open{display:block}
.cta-zone{margin-top:34px;text-align:center}
.cta-lead{font-family:var(--maru);font-size:16px;color:var(--ink);font-weight:700;margin:0 0 14px;line-height:1.7;letter-spacing:.03em}
.btn-cta{display:block;width:100%;border:none;cursor:pointer;font-family:var(--maru);font-weight:700;font-size:17px;
  letter-spacing:.04em;border-radius:999px;padding:17px 20px;background:var(--crimson);color:#FFFDF8;
  box-shadow:0 8px 20px rgba(138,59,47,.30);transition:transform .12s ease}
.btn-cta:active{transform:scale(.98)}
.retry{margin-top:14px}
.disclaimer{text-align:center;color:var(--ink-soft);font-size:11.5px;line-height:1.7;margin:30px 0 0;padding-top:18px;border-top:1px solid var(--line)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:380px){.ko-h1{font-size:26px}.type-name{font-size:30px}.q{font-size:18px}}
</style>
</head>

let qi=0, answers=new Array(QUESTIONS.length).fill(null);
const $=id=>document.getElementById(id);
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));$(id).classList.add('active');window.scrollTo({top:0,behavior:'instant'});}
function renderQ(){
  const Q=QUESTIONS[qi];
  $('qText').textContent=Q.q; $('qnow').textContent=qi+1;
  $('progBar').style.width=Math.round((qi)/QUESTIONS.length*100)+'%';
  $('qpct').textContent=Math.round((qi+1)/QUESTIONS.length*100)+'%';
  const box=$('opts'); box.innerHTML='';
  Q.a.forEach((opt,idx)=>{
    const b=document.createElement('button');
    b.className='opt'+(answers[qi]===idx?' sel':'');
    b.innerHTML='<span class="dot"></span><span>'+opt.t+'</span>';
    b.onclick=()=>{answers[qi]=idx;box.querySelectorAll('.opt').forEach(e=>e.classList.remove('sel'));b.classList.add('sel');setTimeout(next,230);};
    box.appendChild(b);
  });
  $('backBtn').style.visibility = qi===0 ? 'hidden':'visible';
}
function next(){ if(qi<QUESTIONS.length-1){qi++;renderQ();} else {finish();} }
function back(){ if(qi>0){qi--;renderQ();} }
function diagnose(){
  const sc={}; TYPE_ORDER.forEach(t=>sc[t]=0);
  answers.forEach((ai,i)=>{const s=QUESTIONS[i].a[ai].s;for(const k in s)sc[k]+=s[k];});
  let best=TYPE_ORDER[0]; TYPE_ORDER.forEach(t=>{if(sc[t]>sc[best])best=t;});
  return best;
}
const CATCLASS={"乾燥":"cat-kanso","更年期":"cat-kounenki","慢性疲労感":"cat-mansei","眼精疲労":"cat-gansei","眠り":"cat-nemuri"};
function makeCard(r){
  const c=document.createElement('div'); c.className='rcard';
  const ph=PHOTOS[r.name]; const bc=CATCLASS[r.cat]||'';
  c.innerHTML='<div class="rtext"><span class="rbadge '+bc+'">'+r.cat+'</span><span class="rname">'+r.name+'</span></div>'
    +(ph?'<img class="rphoto" alt="'+r.name+'" src="data:image/jpeg;base64,'+ph+'">':'');
  return c;
}
function buildGroup(list){            // 1カテゴリ分（見出しなし）／3品超で内側アコーディオン
  const block=document.createElement('div'); block.className='cat-block';
  const LIMIT=3;
  list.forEach((r,i)=>{const c=makeCard(r); if(i>=LIMIT)c.classList.add('hidden-r','acc-item'); block.appendChild(c);});
  if(list.length>LIMIT){
    const rest=list.length-LIMIT;
    const m=document.createElement('button'); m.className='more';
    const base='ほかの'+rest+'品を見る';
    m.innerHTML='<span class="more-lbl">'+base+'</span><span class="chev">＋</span>';
    m.onclick=()=>{
      block.querySelectorAll('.acc-item').forEach(e=>e.classList.toggle('hidden-r'));
      const open=block.querySelectorAll('.acc-item.hidden-r').length===0;
      m.querySelector('.chev').textContent=open?'−':'＋';
      m.querySelector('.more-lbl').textContent=open?'とじる':base;
    };
    block.appendChild(m);
  }
  return block;
}
function finish(){
  const type=diagnose();
  $('rType').textContent=type+"タイプ"; $('rYomi').textContent=YOMI[type]; $('rDesc').textContent=DESC[type];
  const cats=$('cats'); cats.innerHTML='';
  const matched=CATS.map(cat=>({cat,list:RECIPES.filter(r=>r.cat===cat && r.types.includes(type))})).filter(o=>o.list.length>0);

  const reco=document.createElement('p'); reco.className='reco-title'; reco.textContent='あなたにオススメのレシピ';
  cats.appendChild(reco);

  // 初期表示：先頭3カテゴリから1品ずつ（全体で最大3枚）
  const preview=document.createElement('div'); preview.className='preview';
  matched.slice(0,3).forEach(o=>preview.appendChild(makeCard(o.list[0])));
  cats.appendChild(preview);

  // 外側アコーディオン
  const seeAll=document.createElement('button'); seeAll.className='see-all';
  const baseL='全レシピを見る';
  seeAll.innerHTML='<span class="sa-lbl">'+baseL+'</span><span class="chev">＋</span>';

  // 全レシピ（全カテゴリ／各カテゴリ内は3品超で内側アコーディオン）
  const full=document.createElement('div'); full.className='full-panel'; full.style.display='none';
  matched.forEach(o=>full.appendChild(buildGroup(o.list)));

  seeAll.onclick=()=>{
    const open=full.style.display==='none';
    full.style.display=open?'block':'none';
    preview.style.display=open?'none':'block';
    seeAll.querySelector('.chev').textContent=open?'−':'＋';
    seeAll.querySelector('.sa-lbl').textContent=open?'とじる':baseL;
  };
  cats.appendChild(seeAll); cats.appendChild(full);
  show('result');
}
$('startBtn').onclick=()=>{qi=0;answers.fill(null);renderQ();show('quiz');};
$('backBtn').onclick=back;
$('retryBtn').onclick=()=>{qi=0;answers.fill(null);show('start');};
$('ctaBtn').onclick=(e)=>{ if($('ctaBtn').getAttribute('href')==='#'){e.preventDefault();} };
</script>
